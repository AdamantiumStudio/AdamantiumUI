# --- Versions you may need to adjust to your setup ---

# Rider version to build against, and the oldest one the plugin installs in. sinceBuild must match
# (2026.2 -> "262").
platformVersion=2026.2
sinceBuild=262

# The LSP4IJ plugin version you have installed in Rider.
# Check: Rider -> Settings -> Plugins -> LSP4IJ -> version, then set it here.
lsp4ijPlugin=com.redhat.devtools.lsp4ij:0.21.0

# Configuration used to publish the bundled language server (Release for distribution).
serverConfiguration=Release

# --- Build settings ---
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
