# Publishes the UI's packages to nuget.org without a stored key, the same way the engine does.
#
# The job asks GitHub for a short-lived OIDC token, NuGet/login exchanges it for a temporary API key good for one
# hour, and the push uses that. Nothing to rotate and nothing to leak.
#
# The matching policy on nuget.org (Account -> Trusted Publishing) must name:
#   Repository Owner: AdamantiumStudio
#   Repository:       AdamantiumUI
#   Workflow File:    publish-nuget.yml     <- this file's NAME only, no path
#   Environment:      (leave empty)
# Renaming this file breaks publishing until the policy is changed to match: the name is half of what is trusted.
#
# The engine packages the UI depends on must already be on nuget.org: there is no engine beside the clone on a runner,
# so the UI is built and packed against the published ones, of the version in Directory.Build.props.
name: Publish to NuGet

# Manual, and dry by default. A published version can be unlisted but never deleted and never replaced, so it should
# take a deliberate act rather than follow from a push.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only, do not publish'
        type: boolean
        default: true

jobs:
  # CEF and the WebView helper for each platform, as Adamantium.UI.WebView.Runtime.<rid>: CEF from this repository's
  # release (native/fetch-cef, checked against its SHA-256), the helper published ahead of time - on a runner of that
  # platform, as NativeAOT does not build for another system.
  cef-runtime:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: CEF
        shell: bash
        run: |
          if [ "${{ matrix.rid }}" = win-x64 ]; then
            powershell -NoProfile -File Adamantium.UI.WebView/native/fetch-cef.ps1 -Rid win-x64
          else
            bash Adamantium.UI.WebView/native/fetch-cef.sh linux-x64
          fi

      - name: Helper (Windows)
        if: matrix.rid == 'win-x64'
        run: dotnet publish Adamantium.UI.WebView.Helper/Adamantium.UI.WebView.Helper.csproj -c Release -r win-x64 -o artifacts/helper

      # In .NET's cross-build image, against its old root file system: built on the runner the helper would ask the
      # runner's glibc, newer than CEF's. The runner's .NET is mounted in.
      - name: Helper (Linux)
        if: matrix.rid == 'linux-x64'
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -v "$DOTNET_ROOT:/dotnet" -w /src -e DOTNET_CLI_HOME=/tmp
          -e NUGET_PACKAGES=/tmp/nuget mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-amd64
          /dotnet/dotnet publish Adamantium.UI.WebView.Helper/Adamantium.UI.WebView.Helper.csproj -c Release -r linux-x64
          -p:SysRoot=/crossrootfs/x64 -p:LinkerFlavor=lld -o artifacts/helper

      - name: The helper asks no newer glibc than CEF
        if: matrix.rid == 'linux-x64'
        run: |
          newest() { objdump -T "$1" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1; }
          helper=$(newest artifacts/helper/Adamantium.UI.WebView.Helper)
          cef=$(newest Adamantium.UI.WebView/runtimes/linux-x64/native/cef/libcef.so)
          echo "helper $helper, libcef $cef"
          [ "$(printf '%s\n%s\n' "$helper" "$cef" | sort -V | tail -1)" = "$cef" ]

      - name: Pack
        shell: bash
        run: >
          dotnet pack Adamantium.UI.WebView.Runtime/Adamantium.UI.WebView.Runtime.csproj -c Release
          -p:CefRid=${{ matrix.rid }} -p:HelperFolder="$GITHUB_WORKSPACE/artifacts/helper" -o artifacts/nupkg

      - name: Upload the package as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: cef-runtime-${{ matrix.rid }}
          path: artifacts/nupkg/*.nupkg

  publish:
    needs: cef-runtime
    # Windows: the effects generator compiles the UI's shaders during the build and loads Slang through kernel32.
    runs-on: windows-latest
    permissions:
      id-token: write   # lets the job ask GitHub for the OIDC token; without it NuGet/login has nothing to exchange
      contents: read

    steps:
      - uses: actions/checkout@v7

      # The binding generator is in the solution but is not packed: it builds from QuantumBinding's source, which needs
      # no published QuantumBinding package for each generator change.
      - name: QuantumBinding
        shell: bash
        run: git clone --depth 1 --branch master https://github.com/AdamantiumStudio/QuantumBinding.git ../QuantumBinding

      # Version comes from global.json, so CI and a developer's machine build with the same SDK.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The solution, not a list: only the projects that set IsPackable are packed, and every one of them shares the
      # version in Directory.Build.props - the only place a version is set. A version already on nuget.org is skipped
      # by the push below, so a release that forgot to raise it publishes nothing.
      #
      # Built first, packed after: Adamantium.UI's pack puts the designer host in, and the host references
      # Adamantium.UI, so in one parallel build-and-pack each could wait for the other (MSB4006, a circular dependency
      # through ResolveProjectReferences). Packed with --no-build, the pack only asks where the built host is.
      - name: Build
        run: dotnet build AdamantiumUI.sln -c Release

      - name: Pack
        run: dotnet pack AdamantiumUI.sln -c Release --no-build -o artifacts/nupkg

      # The runtime packages the cef-runtime jobs made, beside the others: shown, uploaded and pushed with them.
      - name: CEF runtime packages
        uses: actions/download-artifact@v7
        with:
          pattern: cef-runtime-*
          path: artifacts/nupkg
          merge-multiple: true

      # Printed, because the things worth checking before an irreversible push are all in here: the version, the
      # licence, the dependencies, and that analyzers, build files and content landed where a consumer looks for them.
      - name: Show what was packed
        shell: bash
        run: |
          ls -la artifacts/nupkg
          for f in artifacts/nupkg/*.nupkg; do
            echo "===== $f"
            unzip -p "$f" '*.nuspec'
            echo "--- files"
            unzip -l "$f" | grep -E 'README.md|icon.png|\.dll|\.targets|\.cur' || true
          done

      - name: Upload packages as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/nupkg/*.nupkg

      # Asked for as late as possible: the key expires an hour after it is issued.
      - name: NuGet login (OIDC to a temporary key)
        if: ${{ !inputs.dry_run }}
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, not the e-mail address

      # One file at a time: on Windows NuGet's own wildcard finds nothing in "artifacts/nupkg/*.nupkg", so the shell
      # expands it. The packages depend on each other, but nuget.org does not check dependencies on push, so the order
      # does not matter, and --skip-duplicate lets a failed run be started again.
      - name: Push
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          for f in artifacts/nupkg/*.nupkg; do
            dotnet nuget push "$f" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
