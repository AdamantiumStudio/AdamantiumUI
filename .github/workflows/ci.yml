# Builds the UI against the engine's master and runs the tests that need no GPU: for every pull request, and for main
# once it is merged into. The engine is cloned beside the UI, as on a developer's machine, so the projects reference its
# source. Nothing is packed here: packages are made against the published engine packages, and that is a release's
# build (publish-nuget.yml, a dry run unless told). Windows only: the effects generator compiles the shaders during the
# build and loads Slang through kernel32.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fit to be a required check: the job always runs and always reports. What it skips is the work, when nothing but
  # documents, icons, settings or the editor plugins (not built here) changed.
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A list of what to skip rather than of what to build, so a new project folder is built without anyone adding it.
      # With nothing to compare against - a manual run, a history that is not there - everything counts as code.
      - name: Changes
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          code=true
          range=
          case "$EVENT" in
            pull_request) range="$BASE...$HEAD" ;;
            push) if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..$SHA"; fi ;;
          esac
          if [ -n "$range" ]; then
            code=false
            while IFS= read -r f; do
              case "$f" in
                ""|*.md|LICENSE|NOTICE|*icon.png|.gitignore|*.DotSettings|editors/*|.github/images/*|.github/ISSUE_TEMPLATE/*) ;;
                *) code=true ;;
              esac
            done < <(git diff --name-only "$range")
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

      # Where Directory.Build.props looks for it. An engine change is built here once it is merged into master, with no
      # packages published for it.
      - name: Engine
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch master https://github.com/AdamantiumStudio/AdamantiumEngine.git ../AdamantiumEngine
          git -C ../AdamantiumEngine log -1 --format='Engine at %h: %s'

      # Version comes from global.json, so CI and a developer's machine build with the same SDK.
      - uses: actions/setup-dotnet@v6
        if: steps.changes.outputs.code == 'true'
        with:
          global-json-file: global.json

      # bash, not the default PowerShell: PowerShell judges a step by its LAST command only, so a failed first build
      # followed by a good second one would pass.
      - name: Build
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          dotnet build AdamantiumUI.sln -c Release -warnaserror
          dotnet build AdamantiumUI.Tests.sln -c Release -warnaserror

      # The runners have no GPU: the [Category("Gpu")] tests, the scenarios ([Category("Scenario")], each a window of the
      # sandbox) and Adamantium.UI.GraphicsTests, which renders only, are left out; every other test runs without one.
      #
      # Everything runs at once, each in a process of its own; the tests inside a process stay sequential. The markup
      # tests, the longest suite, are split three ways by class name: Canvas..., A/B/L..., and the rest - so a new class
      # always lands somewhere. A name filter would also pick the Explicit sweeps, so their categories are left out of it.
      # The sweeps themselves (every markup file of the repository: the editor flags nothing the build accepts) read the
      # Release build above, as the language server reads a built project.
      - name: Test
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          pids=(); logs=()
          run() {
            local log="$RUNNER_TEMP/$1.log"; shift
            dotnet test "$@" -c Release --no-build > "$log" 2>&1 &
            pids+=($!); logs+=("$log")
          }
          xaml=Tests/Adamantium.XamlTests/Adamantium.XamlTests.csproj
          ns=FullyQualifiedName~Adamantium.XamlTests
          not=FullyQualifiedName!~Adamantium.XamlTests
          plain="TestCategory!=MarkupSweep&TestCategory!=MarkupFuzz"
          run xaml-canvas $xaml --filter "$plain&${ns}.Canvas"
          run xaml-abl $xaml --filter "$plain&(${ns}.A|${ns}.B|${ns}.L)"
          run xaml-rest $xaml --filter "$plain&${not}.Canvas&${not}.A&${not}.B&${not}.L"
          run sweeps $xaml --filter "TestCategory=MarkupSweep"
          run ui Tests/Adamantium.UITests/Adamantium.UITests.csproj --filter "TestCategory!=Gpu"
          run sandbox Tests/Adamantium.UI.Sandbox.Tests/Adamantium.UI.Sandbox.Tests.csproj --filter "TestCategory!=Scenario"
          status=0
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}" || status=1
            cat "${logs[$i]}"
          done
          exit $status
